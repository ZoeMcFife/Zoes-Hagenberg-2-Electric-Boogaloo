services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: pokemondb
      MARIADB_USER: pokemonuser
      MARIADB_PASSWORD: pokemonpass
    ports:
      - "3306:3306"
    volumes:
      - pokemon_data:/var/lib/mysql

volumes:
  pokemon_data:
